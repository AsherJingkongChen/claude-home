[package]
name = "claude-home"
description = "Claude's home"
version = "0.0.1"
edition = "2024"
publish = false

[dependencies]
croner = { version = "4.0.2", default-features = false, features = ["jiff"] }
jiff = "0.2.38"
serde_json = "1"
unicode-script = "0.5.8"

# A hook is a fresh process on every event, so startup and size are the budget.
# panic = "abort": no unwinding is needed, a panicking hook just exits non-zero,
# which Claude Code treats as a non-blocking error.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
