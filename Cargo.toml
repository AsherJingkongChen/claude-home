[package]
name = "claude-home"
description = "Hooks for the Claude Code residents of this house. One binary per hook event."
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
jiff = "0.2.38"
serde_json = "1"

# A hook is a fresh process on every event, so startup and size are the budget.
# panic = "abort": no unwinding is needed, a panicking hook just exits non-zero,
# which Claude Code treats as a non-blocking error.
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"
